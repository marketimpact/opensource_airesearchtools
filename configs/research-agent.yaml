schedule:
  runs_per_day: 6
  rotate_categories: true

scoring:
  authority_db: "configs/source-authority.yaml"
  history_file: "data/findings_history.json"
  min_composite_score: 2.0
  history_lookback_days: 30
  weights:
    source_reliability: 0.30
    corroboration: 0.25
    specificity: 0.20
    recency: 0.15
    geographic_relevance: 0.10

paths:
  findings: "data/findings.md"
  dedup_index: "data/findings_index.json"
  history: "data/findings_history.json"
  log_dir: "data/logs"
