model: "gemma4:31b"
ollama_url: "http://localhost:11434"

search:
  provider: "duckduckgo"
  max_results_per_query: 10
  request_delay_seconds: 3

languages:
  - code: "en"
    name: "English"
    region: "wt-wt"
  - code: "fa"
    name: "Farsi"
    region: "ir-fa"
  - code: "ar"
    name: "Arabic"
    region: "xa-ar"
  - code: "tr"
    name: "Turkish"
    region: "tr-tr"
  - code: "ru"
    name: "Russian"
    region: "ru-ru"
  - code: "zh"
    name: "Chinese"
    region: "cn-zh"
  - code: "fr"
    name: "French"
    region: "fr-fr"

