# Source Authority Database
# Curated reliability ratings for the research agent scoring system.
#
# tier: 1-5 (maps directly to source_reliability score)
#   5 = Tier-1 wire service or international body
#   4 = Major national outlet or government source
#   3 = Established regional/specialist outlet
#   2 = Smaller but recognized outlet
#   1 = Known unreliable or propaganda source
#
# geographic_focus: regions this source primarily covers

